[package]
name = "bevy_iced"
version = "0.5.0"
edition = "2024"
description = "Iced integration for Bevy"
authors = ["tasgon <me@tas.sh>"]
license = "MIT OR Apache-2.0"
keywords = ["bevy", "iced", "ui", "game", "gui"]
homepage = "https://github.com/tasgon/bevy_iced"
repository = "https://github.com/tasgon/bevy_iced"
documentation = "https://docs.rs/bevy_iced"

[dependencies]
bevy_app = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_derive = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_input = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_render = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_utils = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }
bevy_window = { git = "https://github.com/bevyengine/bevy.git", rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c" }

iced_core = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "2270768457f01c52456fb3e050e7ad6d57cfb962" }
iced_graphics = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "2270768457f01c52456fb3e050e7ad6d57cfb962" }
iced_renderer = { git = "https://github.com/Argeo-Robotics/iced.git", features = ["wgpu"], rev = "2270768457f01c52456fb3e050e7ad6d57cfb962" }
iced_runtime = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "2270768457f01c52456fb3e050e7ad6d57cfb962" }
iced_wgpu = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "2270768457f01c52456fb3e050e7ad6d57cfb962" }
iced_widget = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "2270768457f01c52456fb3e050e7ad6d57cfb962" }

cfg-if = "1.0.0"

[dev-dependencies.bevy]
git = "https://github.com/bevyengine/bevy.git"
rev = "8d5474a2f285d2abd3c54c6545a1a7abb12c8d2c"
default-features = false
features = [
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_window",
    "multi_threaded",
    "webgpu",
    "x11"
]

[dev-dependencies]
getrandom = { version = "0.3.1", features = ["wasm_js"] }
rand = "0.9"
